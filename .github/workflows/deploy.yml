name: Deploy Django App

on:
  push:
    branches:
      - aws-ec2-docker

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install docker-compose

    - name: Configure SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Add SSH key to agent
      run: |
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_ed25519

    - name: Deploy to EC2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          cd ~/guichet-clone
          git remote set-url origin git@github.com:simofirdoussi/guichet-clone.git
          git pull origin aws-ec2-docker || exit 1

          if [ $? -ne 0 ]; then
            echo "Failed to pull the latest changes from the repository"
            exit 1
          fi
          sudo docker-compose down
          sudo docker-compose build
          sudo docker-compose up -d
          sudo docker-compose run web python manage.py migrate
          sudo docker-compose run web python manage.py collectstatic --noinput
        EOF
